<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- CSS global do projeto -->
    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body>
    <!-- Navbar fixa: cabeçalho e pesquisa -->
    <nav class="navbar-fixa">
        <header class="cabecalho">
            <h1 class="titulo">TITULO</h1>
            <button type="button" class="botao-entrar">ENTRAR</button>
        </header>

        <section class="area-pesquisa">
            <form class="pesquisa" role="search" id="formPesquisa">
                <input
                    type="search"
                    class="campo-pesquisa"
                    aria-label="Pesquisar receitas"
                >
                <button
                    type="submit"
                    class="botao-pesquisar"
                    aria-label="Pesquisar"
                >
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </section>
    </nav>

    <!-- 1º -->
    <main class="lista-receitas">
        <button
            type="button"
            class="cartao-receita"
            data-bs-toggle="modal"
            data-bs-target="#modalReceita-1"
        >
            <span class="imagem-miniatura">IMAGEM</span>

            <span class="informacoes-miniatura">
                <span class="nome-miniatura">NOME:</span>
                </br>
                </br>
                <span class="descricao-miniatura">• DESCRIÇÃO...</span>
            </span>
        </button>
    </main>

    <!-- Modal da receita -->
    <div
        class="modal fade modal-receita"
        id="modalReceita-1"
        tabindex="-1" 
        aria-labelledby="modalReceita1Titulo"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <button
                    type="button"
                    class="botao-fechar"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                >
                    <i class="bi bi-x"></i>
                </button>

                <div class="modal-body">
                    <section class="receita-topo">
                        <div class="imagem-grande">IMAGEM</div>

                        <div class="receita-informacoes">
                            <h2 class="receita-nome" id="modalReceita1Titulo">
                                NOME:
                            </h2>
                            <p class="receita-descricao">• DESCRIÇÃO...</p>

                        </div>
                    </section>

                    <section class="receita-detalhes">
                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">INGREDIENTES:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>

                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">PREPARO:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- 2º -->
    <main class="lista-receitas">
        <button
            type="button"
            class="cartao-receita"
            data-bs-toggle="modal"
            data-bs-target="#modalReceita-2"
        >
            <span class="imagem-miniatura">IMAGEM</span>

            <span class="informacoes-miniatura">
                <span class="nome-miniatura">NOME:</span>
                </br>
                </br>
                <span class="descricao-miniatura">• DESCRIÇÃO...</span>
            </span>
        </button>
    </main>

    <!-- Modal da receita -->
    <div
        class="modal fade modal-receita"
        id="modalReceita-2"
        tabindex="-1"
        aria-labelledby="modalReceita2Titulo"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <button
                    type="button"
                    class="botao-fechar"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                >
                    <i class="bi bi-x"></i>
                </button>

                <div class="modal-body">
                    <section class="receita-topo">
                        <div class="imagem-grande">IMAGEM</div>

                        <div class="receita-informacoes">
                            <h2 class="receita-nome" id="modalReceita2Titulo">
                                NOME:
                            </h2>
                            <p class="receita-descricao">• DESCRIÇÃO...</p>

                        </div>
                    </section>

                    <section class="receita-detalhes">
                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">INGREDIENTES:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>

                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">PREPARO:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // A pesquisa ainda não filtra receitas; evita recarregar a página.
        document.getElementById("formPesquisa").addEventListener("submit", function (event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
