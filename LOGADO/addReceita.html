<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/add-receita.css">
</head>

<body>
    <div class="receita-container">
        <h1>RECEITA</h1>

        <input type="text" placeholder="NOME DA RECEITA">
        <textarea class="descricao" placeholder="DESCRIÇÃO"></textarea>

        <!-- div de ingredientes -->
        <h2>INGREDIENTES</h2>
        <div class="lista">
            <div class="itens">
                <div class="item">
                    <input class="ingrediente" type="text" placeholder="INGREDIENTE">
                </div>
            </div>

            <button type="button" id="adicionar">+</button>
        </div>


        <h2>MODE DE PREPARO</h2>
        <textarea class="descricao" placeholder="MODO DE PREPARO"></textarea>

        <a class="adicionar" href="../LOGADO/index-L.html">CADASTRAR</a>
    </div>

    <script>
        // Ajusta automaticamente a altura das áreas de texto.
        document.querySelectorAll(".descricao").forEach(function (textarea) {
            textarea.addEventListener("input", function () {
                this.style.height = "auto";
                this.style.height = this.scrollHeight + "px";
            });
        });

        const botaoAdicionar = document.querySelector("#adicionar");
        const lista = document.querySelector(".itens");

        // Cria um campo de ingrediente.
        function criarIngrediente() {
            const item = document.createElement("div");
            item.classList.add("item");

            const input = document.createElement("input");
            input.classList.add("ingrediente");
            input.type = "text";
            input.placeholder = "INGREDIENTE";

            const botaoRemover = document.createElement("button");
            botaoRemover.type = "button";
            botaoRemover.classList.add("remover-ingrediente");
            botaoRemover.textContent = "−";
            botaoRemover.setAttribute("aria-label", "Remover ingrediente");

            botaoRemover.addEventListener("click", function () {
                item.remove();
                atualizarBotoesRemover();
            });

            item.appendChild(input);
            item.appendChild(botaoRemover);

            return item;
        }

        // Mostra o botão de remover apenas se houver mais de um ingrediente.
        function atualizarBotoesRemover() {
            const itens = lista.querySelectorAll(".item");

            itens.forEach(function (item) {
                const botaoRemover = item.querySelector(".remover-ingrediente");

                if (botaoRemover) {
                    botaoRemover.hidden = itens.length <= 1;
                }
            });
        }

        // Adiciona ingredientes.
        botaoAdicionar.addEventListener("click", function () {
            lista.appendChild(criarIngrediente());
            atualizarBotoesRemover();
        });

        // Inicializa o estado dos botões.
        atualizarBotoesRemover();
    </script>
</body>

</html>
