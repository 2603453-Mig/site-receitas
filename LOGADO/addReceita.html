<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
     <link rel="stylesheet" href="../CSS/add-receita.css">
</head>
<body>
    <div class="receita-container">
        <h1>RECEITA</h1>

        <input type="text" placeholder="NOME DA RECEITA">
        <textarea class="descricao" placeholder="DESCRIÇÃO"></textarea>

        <!-- div de ingredientes -->
        <h2>INGREDIENTES</h2>
        <div class="lista">
            <div class="itens">
                <div class="item">
                    <input id="ingrediente" type="text" placeholder="INGREDIENTE">
                </div>
            </div>
            <button type="button" id="adicionar">+</button>
        </div>
        
        
        <h2>MODE DE PREPARO</h2>
        <textarea class="descricao" placeholder="MODO DE PREPARO"></textarea>

        <button>ADICIONAR</button>
    </div>

    <script>
        const textarea = document.querySelectorAll (".descricao");

        textarea.forEach(textarea =>{
            textarea.addEventListener("input", function() {
                this.style.height = "auto";
                this.style.height = this.scrollHeight + "px";
            });
        });

        const botao = document.querySelector("#adicionar");
        const lista = document.querySelector(".itens");

        botao.addEventListener("click", function(){
            const item = document.createElement("div");
            item.classList.add("item");

            const input = document.createElement("input");
            input.id = "ingrediente";
            input.type = "text";
            input.placeholder = "INGREDIENTE";

            item.appendChild(input);
            lista.appendChild(item);
        });

    </script>
</body>
</html>
