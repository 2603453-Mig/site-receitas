<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- CSS global do projeto -->
    <link rel="stylesheet" href="../CSS/global.css">
</head>

<body>
    <!-- Navbar fixa: cabeçalho e pesquisa -->
    <nav class="navbar-fixa">
        <header class="cabecalho">
            <h1 class="titulo">TITULO</h1>
            <div class="botoes-navbar">
              <button type="button" class="botao-salvar">SALVOS</button>
              <button type="button" class="botao-entrar">ENTRAR</button>
            </div>
        </header>

        <section class="area-pesquisa">
            <form class="pesquisa" role="search" id="formPesquisa">
                <input
                    type="search"
                    class="campo-pesquisa"
                    aria-label="Pesquisar receitas"
                >
                <button
                    type="submit"
                    class="botao-pesquisar"
                    aria-label="Pesquisar"
                >
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </section>
    </nav>

    <!-- 1º -->
    <main class="lista-receitas">
      <article
          class="cartao-receita"
          role="button"
          tabindex="0"
          data-modal="#modalReceita-1"
      >
        <span class="imagem-miniatura">
            <img src="IMAGENS/Bolo_de_Cenoura.jpeg" alt="Bolo de Cenoura">
        </span>

          <span class="informacoes-miniatura">
              <span class="nome-miniatura">Nome: Bolo de Cenoura</span>
              <br><br>
              <span class="descricao-miniatura">• DESCRIÇÃO...</span>
          </span>

          <button
              type="button"
              class="botao-favorito"
              aria-label="Salvar nos favoritos"
              aria-pressed="false"
              data-receita-id="receita-1"
          >
              <i class="bi bi-star"></i>
          </button>
      </article>
    </main>

    <!-- Modal da receita -->
    <div
        class="modal fade modal-receita"
        id="modalReceita-1"
        tabindex="-1"
        aria-labelledby="modalReceita1Titulo"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">

                <button
                    type="button"
                    class="botao-fechar"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                >
                    <i class="bi bi-x"></i>
                </button>

                <div class="modal-body">
                    <section class="receita-topo">
                        <div class="imagem-grande"><img src="IMAGENS/Bolo_de_Cenoura.jpeg" alt="Bolo de Cenoura"></div>

                        <div class="receita-informacoes">
                            <h2 class="receita-nome" id="modalReceita1Titulo">
                                Bolo de Cenoura
                            </h2>

                            <p class="receita-descricao">
                                • DESCRIÇÃO...
                            </p>
                        </div>
                    </section>

                    <section class="receita-detalhes">
                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">INGREDIENTES:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>

                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">PREPARO:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>
                    </section>
                </div>

            </div>
        </div>
    </div>
    <!-- 1º -->
    <!-- 2º -->
    <main class="lista-receitas">
      <article
          class="cartao-receita"
          role="button"
          tabindex="0"
          data-modal="#modalReceita-2"
      >
          <span class="imagem-miniatura">IMAGEM</span>

          <span class="informacoes-miniatura">
              <span class="nome-miniatura">NOME:</span>
              <br><br>
              <span class="descricao-miniatura">• DESCRIÇÃO...</span>
          </span>

          <button
              type="button"
              class="botao-favorito"
              aria-label="Salvar nos favoritos"
              aria-pressed="false"
              data-receita-id="receita-2"
          >
              <i class="bi bi-star"></i>
          </button>
      </article>
    </main>

    <!-- Modal da receita -->
    <div
        class="modal fade modal-receita"
        id="modalReceita-2"
        tabindex="-1"
        aria-labelledby="modalReceita1Titulo"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">

                <button
                    type="button"
                    class="botao-fechar"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                >
                    <i class="bi bi-x"></i>
                </button>

                <div class="modal-body">
                    <section class="receita-topo">
                        <div class="imagem-grande">IMAGEM</div>

                        <div class="receita-informacoes">
                            <h2 class="receita-nome" id="modalReceita2Titulo">
                                NOME:
                            </h2>

                            <p class="receita-descricao">
                                • DESCRIÇÃO...
                            </p>
                        </div>
                    </section>

                    <section class="receita-detalhes">
                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">INGREDIENTES:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>

                        <div class="detalhe-coluna">
                            <h3 class="detalhe-titulo">PREPARO:</h3>
                            <p class="detalhe-descricao">DESCRIÇÃO</p>
                        </div>
                    </section>
                </div>

            </div>
        </div>
    </div>
    <!-- 2º -->

    <button
        type="button"
        class="btn btn-primary botao-adicionar"
        aria-label="Adicionar receita"
        title="Adicionar receita"
    >
        <i class="bi bi-plus-lg"></i>
    </button>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
      // Impede que a pesquisa recarregue a página.
      const formPesquisa = document.getElementById("formPesquisa");

      if (formPesquisa) {
          formPesquisa.addEventListener("submit", function (event) {
              event.preventDefault();
          });
      }

      // Recupera os favoritos salvos.
      function obterFavoritos() {
          try {
              const dados = JSON.parse(
                  localStorage.getItem("receitasFavoritas") || "[]"
              );

              return Array.isArray(dados) ? dados : [];
          } catch (erro) {
              return [];
          }
      }

      let favoritos = obterFavoritos();

      // Inicializa e controla cada estrela.
      document.querySelectorAll(".botao-favorito").forEach(function (botao) {
          const icone = botao.querySelector("i");
          const id = botao.dataset.receitaId;

          function atualizarEstrela() {
              const salvo = favoritos.includes(id);

              botao.classList.toggle("favorito-ativo", salvo);
              botao.setAttribute("aria-pressed", String(salvo));

              if (icone) {
                  icone.className = salvo
                      ? "bi bi-star-fill"
                      : "bi bi-star";
              }
          }

          atualizarEstrela();

          botao.addEventListener("click", function (event) {
              event.preventDefault();
              event.stopPropagation();

              if (favoritos.includes(id)) {
                  favoritos = favoritos.filter(function (item) {
                      return item !== id;
                  });
              } else {
                  favoritos.push(id);
              }

              localStorage.setItem(
                  "receitasFavoritas",
                  JSON.stringify(favoritos)
              );

              atualizarEstrela();
          });
      });

      // Abre o modal somente quando o cartão é clicado,
      // nunca quando o botão de favorito é clicado.
      document.querySelectorAll(".cartao-receita").forEach(function (cartao) {
          function abrirReceita(event) {
              if (event.target.closest(".botao-favorito")) {
                  return;
              }

              const seletor = cartao.dataset.modal;
              const modalElemento = document.querySelector(seletor);

              if (modalElemento) {
                  bootstrap.Modal.getOrCreateInstance(modalElemento).show();
              }
          }

          cartao.addEventListener("click", abrirReceita);

          // Permite abrir o cartão usando Enter ou Espaço.
          cartao.addEventListener("keydown", function (event) {
              if (event.target !== cartao) return;

              if (event.key === "Enter" || event.key === " ") {
                  event.preventDefault();
                  abrirReceita(event);
              }
          });
      });
  </script>
    
</body>
</html>
